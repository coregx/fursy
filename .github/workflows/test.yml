name: Tests

# Testing Strategy:
# - Tests run on Linux, macOS, and Windows (cross-platform HTTP router)
# - Go 1.27+ required (matches go.mod requirement)
# - Minimal dependencies (core routing: stdlib only, middleware: jwt + x/time)
# - Plugins and examples are built/tested in a separate matrix job
#
# Branch Strategy (GitHub Flow):
# - feature/*, release/*, hotfix/* branches: Development work
# - main branch: Production-ready code only (protected)
# - Pull requests: Must pass all tests before merge
# - Push to main triggers tests as final validation after merge

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Unit tests - Cross-platform
  unit-tests:
    name: Unit Tests - ${{ matrix.os }} - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.27']  # Match go.mod requirement

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet ./...

    - name: Run unit tests with race detector
      shell: bash
      run: go test -short -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.txt
        flags: unittests
        name: codecov-unit
        fail_ci_if_error: false
        verbose: true

  # Plugin tests - build and test each plugin module
  plugins:
    name: Plugin - ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [database, opentelemetry, stream, validator]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Build plugin
      working-directory: plugins/${{ matrix.plugin }}
      run: go build ./...

    - name: Test plugin
      working-directory: plugins/${{ matrix.plugin }}
      run: go test -v ./...

  # Examples - verify all examples compile
  examples:
    name: Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Build examples
      shell: bash
      run: |
        for dir in examples/*/; do
          if [ -f "$dir/go.mod" ]; then
            echo "Building $dir..."
            (cd "$dir" && go mod tidy && go build ./...) || exit 1
          fi
        done
        for dir in examples/validation/*/; do
          if [ -f "$dir/go.mod" ]; then
            echo "Building $dir..."
            (cd "$dir" && go mod tidy && go build ./...) || exit 1
          fi
        done
        echo "All examples built successfully."

  # Security vulnerability check
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: false  # Strict for production library

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m

  # Formatting check
  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
        cache: true

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo ""
          echo "Run 'go fmt ./...' to fix formatting issues."
          exit 1
        fi
        echo "All files are properly formatted ✓"
